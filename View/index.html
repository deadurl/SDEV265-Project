<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Tracker</title>
    <link rel="stylesheet" href="finance.css">
</head>
<body>
    <div class="date-container">
        <header>
            <h2>Finance Journal</h2>
            <p id="current-date-display">Todays' Date:</p>
        </header>
    </div>

    <div class="balance-container">
        <h3>Current Balance</h3>
        <h1 id="total-balance">$0.00</h1>
    </div>

    <form id="ledger-form" method="POST" action="/finance">
      <input type="text" id="form-desc" name="description" placeholder="Description" required>
      <input type="number" id="form-amount" name="amount" placeholder="Amount" step="0.01" required>
      <select id="form-type" name="type">
        <option value="expense">Expense</option>
        <option value="income">Income</option>
      </select>
      <button type="submit">Write Entry</button>
    </form>

   <ul id="history-list">
    {{#history}}
    <li class="history-item {{type}}">
        <span class="entry-date">{{date}}</span>
        <span class="entry-desc">{{description}}</span>
        <span class="entry-amount">{{amount}}</span>
        <button class="delete-btn">&times;</button>
    </li>
    {{/history}}
</ul>
